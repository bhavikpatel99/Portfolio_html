<div class="auth-wrapper">
  <div class="card auth-card">
    <h1 class="text-center">Recruitment Portal</h1>
    <p class="text-center muted mb-4">Sign in to your account</p>

    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <div class="error-text" *ngIf="f.email.touched && f.email.invalid">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        <div class="error-text" *ngIf="f.password.touched && f.password.invalid">
          Password is required.
        </div>
      </div>

      <button type="submit" class="btn btn-block" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <p class="text-center mt-4 muted">
      Don't have an account? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
